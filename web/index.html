        body {

            background: linear-gradient(135deg, #1e3c72, #2a5298);

        .container {

        @keyframes fadeIn {
            from {

            to {

        }

        .faculty {

        }

        .student {
            background: #8e44ad;
        }

        .login-options a:hover {
            transform: translateY(-3px);
